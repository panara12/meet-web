config:
  target: "http://localhost:4000"
  phases:
    - duration: 20
      arrivalRate: 5
  defaults:
    headers:
      content-type: application/json
  variables:
    tenants:
      - harimarketing
      - bhavya_marketing
      - abcmarketing
      - radhemarketing
      - shreemarketing

scenarios:
  - name: "Salesman Flow for Multiple Tenants"
    flow:
      - loop:
          - post:
              url: "/auth/distributerlogin"
              headers:
                x-tenant-domain: "{{ $randomString(tenants) }}"
              json:
                email: "demodis@gmail.com"
                password: "demo@123456"
          - get:
              url: "/salesman/getallsalesman"
              headers:
                x-tenant-domain: "{{ $randomString(tenants) }}"
        count: 5